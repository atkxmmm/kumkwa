<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="เกมกาชาผจญภัยแฟนตาซีแบบ idle ภาพพิกเซล เปิดทิ้งไว้ ทีมสู้เอง">
<meta name="theme-color" content="#0f0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="กิลด์ยามดึก">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>กิลด์ยามดึก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&family=Silkscreen&display=swap">
<style>
/* Late-night café palette: brick browns, plum panels, cream buttons, one neon green. Panels look like the dialogue boxes in a pixel visual novel. */
:root {
  --bg: #0f0b14;
  --panel: #1b1522;
  --panel-2: #251c2f;
  --line: #3a2e48;
  --cream: #f3e6c4;
  --cream-2: #d8c8a0;
  --ink: #1a1220;
  --text: #efe6d8;
  --muted: #a898b0;
  --neon: #7affb0;
  --pink: #ff7ab0;
  --gold: #ffcb52;
  --bean: #b8784a;
  --hp: #ff6a7a;
  --en: #7ad8ff;
  --r: #9fb3c8; --sr: #b98cff; --ssr: #ffcb52;
  --font: "Chakra Petch", system-ui, sans-serif;
  --pix: "Silkscreen", "Chakra Petch", monospace;
  color-scheme: dark;
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45; overscroll-behavior: none; }
body { user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
img.pix { image-rendering: pixelated; image-rendering: crisp-edges; }
img.art { object-fit: contain; }
/* small slots show the face of a generated portrait rather than the whole body */
.pcard .pic img.art, .thumb:not(.icon) img.art, .slot img.art, .hcard img.art, .b-hero .banner-art img.art, .rcard img.art { object-fit: cover; object-position: 50% 8%; }
code { font-family: ui-monospace, monospace; font-size: .85em; color: var(--neon); }

#app { display: flex; flex-direction: column; height: 100dvh; max-width: 520px; margin: 0 auto; padding-top: env(safe-area-inset-top, 0px); }

/* top bar */
.top { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--ink); border-bottom: 2px solid var(--line); }
.stage-chip { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.stage-chip span { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage-chip b { font-family: var(--pix); font-weight: 400; font-size: 1rem; color: var(--neon); }
.cur { display: flex; align-items: center; gap: 5px; background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 3px 8px; font-family: var(--pix); font-size: .9rem; min-width: 74px; }
.coin, .bean { display: inline-block; width: 10px; height: 10px; flex: none; vertical-align: -1px; margin-right: 2px; }
.coin { background: var(--gold); box-shadow: inset -2px -2px 0 #c08a2a, 0 0 0 1px #4a3010; border-radius: 2px; }
.bean { background: var(--bean); border-radius: 50% / 60%; box-shadow: inset 2px 0 0 #e0a070, 0 0 0 1px #3a2010; transform: rotate(-30deg); }
.iconbtn { width: 38px; height: 38px; flex: none; border-radius: 6px; border: 2px solid var(--ink); background: var(--cream); color: var(--ink); font-size: 20px; line-height: 1; box-shadow: 0 2px 0 var(--cream-2); display: grid; place-items: center; }

/* battle */
.battle { position: relative; height: min(50vh, 440px); min-height: 240px; background: #0b0810; display: grid; place-items: center; overflow: hidden; }
.compact .battle { height: min(30vh, 260px); min-height: 170px; }
#cv { display: block; image-rendering: pixelated; touch-action: none; }
.hud { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; }
.hudbtn { font-family: var(--pix); font-size: .72rem; min-width: 54px; height: 30px; padding: 0 8px; border-radius: 5px; border: 2px solid var(--cream); background: rgba(15, 11, 20, .7); color: var(--cream); }
.hudbtn.on { background: var(--cream); color: var(--ink); }
.waves { position: absolute; top: 10px; right: 10px; font-family: var(--pix); font-size: .72rem; color: var(--cream); background: rgba(15, 11, 20, .7); border: 2px solid var(--cream); border-radius: 5px; padding: 3px 8px; }

/* dialogue box */
.dialog { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; align-items: flex-end; gap: 0; cursor: pointer; z-index: 5; }
.dialog.hidden { display: none; }
.dlg-portrait { width: 92px; height: 110px; flex: none; margin-right: -14px; position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: center; }
.dlg-portrait img { max-width: 100%; max-height: 100%; }
.dlg-portrait img.pix { width: 80px; height: 96px; }
.dlg-box { flex: 1; min-height: 84px; background: rgba(18, 12, 22, .92); border: 2px solid #2e2438; border-radius: 8px; padding: 10px 14px 10px 22px; position: relative; box-shadow: 0 4px 0 rgba(0, 0, 0, .5); }
.dlg-name { font-family: var(--pix); font-size: .85rem; margin-bottom: 2px; }
.dlg-text { font-size: .95rem; color: #fff6e8; min-height: 2.8em; }
.dlg-next { position: absolute; right: 10px; bottom: 8px; color: var(--cream); font-size: .7rem; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* party */
.party { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; background: var(--ink); border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); }
.pcard { display: flex; gap: 6px; align-items: center; padding: 5px; border-radius: 6px; border: 2px solid var(--line); background: var(--panel); text-align: left; min-width: 0; position: relative; }
.pcard .pic { width: 36px; height: 40px; flex: none; display: grid; place-items: center; overflow: hidden; border-radius: 4px; background: #120d18; }
.pcard .pic img { width: 100%; height: 100%; object-fit: contain; }
.pcard .pic img.pix { width: 30px; height: 36px; object-fit: cover; object-position: top; }
.pinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pname { font-size: .8rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--c); }
.pname em { font-style: normal; font-weight: 400; color: var(--muted); font-size: .66rem; margin-left: 4px; }
.bar { height: 5px; background: #0b0810; border: 1px solid #000; display: block; }
.bar i { display: block; height: 100%; transition: width .1s linear; }
.bar.hp i { background: var(--hp); }
.bar.en i { background: var(--en); }
.sk { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
.bar.en2 i { background: #ffb04a; }
.bar.locked { opacity: .25; }
.bar.locked i { width: 0 !important; }
.pcard.ready { border-color: var(--en); animation: ready 1s ease-in-out infinite; }
.pcard.ready::after { content: "สกิล!"; position: absolute; top: -9px; right: 4px; font-size: .62rem; font-weight: 700; background: var(--en); color: var(--ink); padding: 0 4px; border-radius: 3px; }
@keyframes ready { 50% { box-shadow: 0 0 0 2px rgba(122, 216, 255, .35); } }
.pcard.down { opacity: .4; filter: grayscale(1); }

/* panel + tabs */
.panel { flex: 1; overflow-y: auto; padding: 10px 10px 16px; -webkit-overflow-scrolling: touch; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--ink); border-top: 2px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); gap: 6px; }
.tabs button { position: relative; border: 2px solid transparent; background: transparent; border-radius: 6px; padding: 6px 2px; font-size: .82rem; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tabs button i { font-style: normal; font-family: var(--pix); font-size: 1rem; line-height: 1; }
.tabs button.dot::after { content: ""; position: absolute; top: 4px; right: 12px; width: 8px; height: 8px; background: var(--neon); border: 2px solid var(--ink); border-radius: 50%; }
.tabs button.on { background: var(--cream); color: var(--ink); border-color: var(--ink); box-shadow: 0 2px 0 var(--cream-2); }

.card { background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; font-weight: 700; }
.card-h small { font-weight: 400; color: var(--muted); font-size: .78rem; }
.pill { font-family: var(--pix); font-weight: 400; font-size: .78rem; color: var(--neon); border: 2px solid var(--neon); border-radius: 4px; padding: 0 6px; }
.kv { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: .9rem; }
.kv span { color: var(--muted); }
.kv b { font-family: var(--pix); font-weight: 400; }
.hint { color: var(--muted); font-size: .8rem; margin: 6px 2px 10px; }
.empty-note { color: var(--muted); font-size: .88rem; text-align: center; padding: 14px 0; margin: 0; }

.btn { border: 2px solid var(--ink); background: var(--cream); color: var(--ink); border-radius: 6px; min-height: 40px; padding: 0 12px; font-weight: 700; font-size: .88rem; box-shadow: 0 3px 0 var(--cream-2); display: inline-flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--cream-2); }
.btn:disabled { opacity: .45; }
.btn.sm { min-height: 34px; font-size: .8rem; padding: 0 9px; }
.btn.ghost { background: transparent; color: var(--cream); border-color: var(--cream); box-shadow: none; }
.btn.gold { background: var(--gold); box-shadow: 0 3px 0 #b88a2a; }
.btn.wide { width: 100%; margin-top: 8px; }

.row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); width: 100%; }
.row:last-child { border-bottom: none; }
.btnrow { background: none; border: none; border-bottom: 1px dashed var(--line); text-align: left; }
.grow { flex: 1; min-width: 0; font-size: .9rem; }
.grow small { color: var(--muted); font-size: .76rem; }
.thumb { width: 42px; height: 46px; flex: none; border-radius: 5px; background: #120d18; border: 2px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: contain; }
.thumb img.pix { width: 34px; height: 40px; object-fit: cover; object-position: top; }
.thumb.icon img.pix, .big-pic.icon img.pix { width: 80%; height: 80%; object-fit: contain; }
.tag { font-size: .68rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--c, var(--neon)); color: var(--ink); white-space: nowrap; }

.gun { font-size: .66rem; padding: 0 5px; border-radius: 3px; border: 1px solid var(--muted); color: var(--muted); vertical-align: 1px; white-space: nowrap; }
.tip { background: #1c2e26; border: 2px solid var(--neon); border-radius: 8px; padding: 8px 10px; font-size: .84rem; margin-bottom: 10px; }
.tip b { color: var(--neon); }
.price { font-family: var(--pix); font-size: .8rem; white-space: nowrap; }
.btnrow:disabled { opacity: .45; }

.quest { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: .88rem; }
.quest:last-child { border-bottom: none; }
.quest.claimed { opacity: .5; }
.qbar { display: block; height: 4px; background: #0b0810; margin-top: 4px; border-radius: 2px; overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--neon); }
.qdone { font-size: .76rem; color: var(--muted); }
/* rarity: SSR cards shimmer gold, SR glow violet */
.hcard.r-SSRb, .slot.r-SSRb { box-shadow: 0 0 0 1px rgba(255, 203, 82, .35), 0 0 14px rgba(255, 203, 82, .28); background: linear-gradient(160deg, #3a2c18, var(--panel-2) 55%); }
.hcard.r-SRb, .slot.r-SRb { box-shadow: 0 0 10px rgba(185, 140, 255, .22); background: linear-gradient(160deg, #2c2240, var(--panel-2) 55%); }
.big-pic.r-SSRb { box-shadow: 0 0 18px rgba(255, 203, 82, .4); }

.rar { font-family: var(--pix); font-size: .66rem; padding: 0 4px; border-radius: 3px; color: var(--ink); vertical-align: 1px; }
.r-R { background: var(--r); } .r-SR { background: var(--sr); } .r-SSR { background: var(--ssr); }
.r-Rb { border-color: var(--r) !important; } .r-SRb { border-color: var(--sr) !important; } .r-SSRb { border-color: var(--ssr) !important; }
.stars { color: var(--gold); font-size: .72rem; letter-spacing: -1px; }
.stars span { color: #3a3048; }

.switch { display: flex; align-items: center; gap: 10px; padding: 10px 0 2px; font-size: .9rem; cursor: pointer; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch span { width: 40px; height: 22px; border: 2px solid var(--cream); border-radius: 4px; position: relative; flex: none; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: var(--cream); transition: left .15s; }
.switch input:checked + span { background: var(--neon); border-color: var(--neon); }
.switch input:checked + span::after { left: 20px; background: var(--ink); }

.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { border: 2px solid var(--c, var(--line)); background: var(--panel-2); border-radius: 6px; padding: 18px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; min-height: 120px; }
.slot img { width: 54px; height: 62px; object-fit: contain; }
.slot img.pix { width: 50px; height: 60px; }
.slot b { font-size: .85rem; } .slot small { color: var(--muted); font-size: .72rem; }
.slot.empty { border-style: dashed; color: var(--muted); font-size: 1.6rem; justify-content: center; }
.slot-n { position: absolute; top: 3px; left: 5px; font-size: .64rem; color: var(--muted); }

.hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.hcard { border: 2px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 6px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative; }
.hcard img { width: 60px; height: 66px; object-fit: contain; }
.hcard img.pix { width: 55px; height: 66px; }
.hcard b { font-size: .88rem; color: var(--c); } .hcard small { color: var(--muted); font-size: .7rem; }
.hc-top { position: absolute; top: 4px; left: 4px; right: 4px; display: flex; justify-content: space-between; }

.chips { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
.chips.wrap { flex-wrap: wrap; }
.chip { border: 2px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: .82rem; white-space: nowrap; }
.chip.on { background: var(--cream); color: var(--ink); border-color: var(--cream); font-weight: 700; }

/* gacha banners */
.banner { display: flex; gap: 10px; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; background: linear-gradient(120deg, #2a1a2e, #1b1522 60%); }
.banner.b-gear { background: linear-gradient(120deg, #1a2a2a, #1b1522 60%); }
.banner-art { width: 96px; flex: none; background: #120d18; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 0; border-right: 2px solid var(--line); }
.banner-art img { width: 48px; height: 48px; object-fit: contain; }
.banner-art img.pix { width: 40px; height: 48px; object-fit: cover; object-position: top; }
.b-gear .banner-art img.pix { width: 36px; height: 36px; object-fit: contain; }
.banner-body { flex: 1; padding: 10px 10px 10px 0; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.banner-body b { font-size: 1rem; }
.banner-body small { color: var(--muted); font-size: .76rem; }
.banner-body .rates b { color: var(--gold); font-size: .8rem; }
.banner-btns { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.banner-btns .btn { flex: 1; }

/* sheets */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet.hidden { display: none; }
.sheet-bg { position: absolute; inset: 0; background: rgba(5, 3, 8, .7); }
.sheet-body { position: relative; width: 100%; max-width: 520px; max-height: 86dvh; overflow-y: auto; background: var(--panel); border: 2px solid var(--line); border-bottom: none; border-radius: 12px 12px 0 0; padding: 14px 14px calc(16px + env(safe-area-inset-bottom, 0px)); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.hero-head { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
.big-pic { width: 88px; height: 100px; flex: none; background: #120d18; border: 2px solid var(--c, var(--line)); border-radius: 8px; display: grid; place-items: center; overflow: hidden; }
.big-pic img { width: 100%; height: 100%; object-fit: contain; }
.big-pic img.pix { width: 80px; height: 96px; }
.hname { font-size: 1.25rem; color: var(--c, var(--text)); }
.hero-head small { color: var(--muted); }
.quote { font-size: .88rem; color: var(--cream); background: rgba(18, 12, 22, .9); border-radius: 6px; padding: 8px 10px; margin: 6px 0 10px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.stats span { background: var(--panel-2); border-radius: 6px; padding: 5px 8px; font-size: .74rem; color: var(--muted); display: flex; flex-direction: column; }
.stats b { font-family: var(--pix); font-weight: 400; font-size: .9rem; color: var(--text); }
.skill { background: var(--panel-2); border-left: 3px solid var(--en); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 2px; }
.skill small { color: var(--muted); font-size: .8rem; }
.skill .next { color: var(--neon); }
.skill b em { font-style: normal; font-weight: 400; font-size: .74rem; color: var(--muted); margin-left: 4px; }
.skill.passive { border-left-color: var(--gold); }
.skill.subs { border-left-color: var(--sr); }
.skill.locked { opacity: .5; }
.switch.tight { padding: 0 2px 10px; font-size: .84rem; }

/* loot card that pops over the battle */
.drop { position: absolute; left: 50%; top: 44px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; background: rgba(18, 12, 22, .95); border: 2px solid var(--line); border-radius: 8px; padding: 8px 12px 8px 8px; min-width: 220px; overflow: hidden; z-index: 6; animation: dropIn .3s ease-out; pointer-events: none; }
.drop.hidden { display: none; }
.drop.r-SSRb { box-shadow: 0 0 24px rgba(255, 203, 82, .6); }
.drop.r-SRb { box-shadow: 0 0 18px rgba(185, 140, 255, .5); }
.drop-pic { width: 46px; height: 46px; flex: none; display: grid; place-items: center; background: #120d18; border-radius: 6px; position: relative; }
.drop-pic img { width: 38px; height: 38px; object-fit: contain; }
.drop-body { display: flex; flex-direction: column; gap: 1px; position: relative; min-width: 0; }
.drop-body small { font-size: .7rem; color: var(--muted); }
.drop-body b { font-size: .95rem; }
.drop-body .rar { align-self: flex-start; }
@keyframes dropIn { from { transform: translate(-50%, -12px) scale(.8); opacity: 0; } }
.enhance-fx { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); font-weight: 700; font-size: 1.6rem; z-index: 40; pointer-events: none; animation: pop .35s ease-out; text-shadow: 0 2px 0 #000; }
.enhance-fx.hidden { display: none; }
.enhance-fx.ok { color: var(--gold); }
.enhance-fx.fail { color: var(--muted); }
.eqs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.eq { border: 2px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 86px; justify-content: center; }
.eq img { width: 36px; height: 36px; object-fit: contain; }
.eq small { font-size: .68rem; color: var(--muted); text-align: center; line-height: 1.25; }
.eq.empty { border-style: dashed; font-size: 1.3rem; color: var(--muted); }
.sheet-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet-btns .btn { flex: 1; }

/* gacha fx */
.gacha-fx { position: fixed; inset: 0; z-index: 30; background: rgba(8, 5, 12, .96); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
.gacha-fx.hidden { display: none; }
.brew-stage { text-align: center; }
.brew-stage p { font-weight: 700; margin: 18px 0 4px; }
.brew-stage small { color: var(--muted); }
.cup { width: 84px; height: 64px; margin: 0 auto; background: var(--cream); border: 4px solid var(--ink); border-radius: 0 0 22px 22px; position: relative; box-shadow: 0 0 0 4px var(--cream-2); }
.cup::after { content: ""; position: absolute; right: -24px; top: 10px; width: 16px; height: 24px; border: 5px solid var(--cream); border-left: none; border-radius: 0 12px 12px 0; }
.cup i { position: absolute; bottom: 70px; width: 6px; height: 22px; background: var(--muted); opacity: 0; animation: steam 1s ease-out infinite; }
.cup i:nth-child(1) { left: 18px; } .cup i:nth-child(2) { left: 38px; animation-delay: .3s; } .cup i:nth-child(3) { left: 58px; animation-delay: .6s; }
.best-SR .cup i { background: var(--sr); } .best-SSR .cup i { background: var(--ssr); }
.best-SSR .cup { animation: shake .12s linear infinite; box-shadow: 0 0 0 4px var(--cream-2), 0 0 40px 10px rgba(255, 203, 82, .5); }
@keyframes steam { 0% { opacity: 0; transform: translateY(10px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-26px); } }
@keyframes shake { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
.results { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; max-width: 480px; }
.single .results { grid-template-columns: 1fr; max-width: 180px; }
.rcard { border: 2px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; position: relative; overflow: hidden; opacity: 0; animation: pop .35s ease-out forwards; }
.rcard img { width: 100%; max-width: 56px; aspect-ratio: 5 / 6; object-fit: contain; position: relative; }
.single .rcard img { max-width: 130px; }
.rcard b { font-size: .7rem; line-height: 1.2; position: relative; }
.single .rcard b { font-size: 1rem; }
.rcard small { font-size: .62rem; color: var(--neon); position: relative; }
.rcard .rar { position: relative; }
.rcard .new { font-family: var(--pix); font-size: .56rem; color: var(--ink); background: var(--neon); padding: 0 3px; border-radius: 2px; position: relative; }
.rcard.r-SSRb { box-shadow: 0 0 16px rgba(255, 203, 82, .5); }
.rays { position: absolute; inset: -50%; background: repeating-conic-gradient(rgba(255, 203, 82, .25) 0 10deg, transparent 10deg 20deg); animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
@keyframes pop { from { opacity: 0; transform: scale(.6) rotateY(90deg); } to { opacity: 1; transform: none; } }
#gachaOk { max-width: 240px; margin-top: 18px; }

#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--cream); color: var(--ink); font-weight: 700; font-size: .85rem; padding: 8px 14px; border-radius: 6px; border: 2px solid var(--ink); opacity: 0; pointer-events: none; transition: .2s; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="stage-chip"><span id="worldName">ตรอกนีออน</span><b id="stageLabel">1-1</b></div>
    <div class="cur" title="ทอง"><span class="coin"></span><b id="gold">0</b></div>
    <div class="cur" title="เมล็ดกาแฟ"><span class="bean"></span><b id="beans">0</b></div>
    <button class="iconbtn" data-act="menu" aria-label="เมนู">≡</button>
  </header>

  <section class="battle" id="battle">
    <canvas id="cv"></canvas>
    <div class="hud">
      <button class="hudbtn" id="autoBtn" data-act="auto">AUTO</button>
      <button class="hudbtn" id="speedBtn" data-act="speed">×1</button>
    </div>
    <div class="waves" id="waveDots"></div>
    <div class="drop hidden" id="drop"></div>
    <div class="enhance-fx hidden" id="enhanceFx"></div>
    <div class="dialog hidden" id="dialog">
      <div class="dlg-portrait"></div>
      <div class="dlg-box"><div class="dlg-name"></div><div class="dlg-text"></div><span class="dlg-next">▶</span></div>
    </div>
  </section>

  <div class="party" id="party"></div>

  <main class="panel" id="panel"></main>

  <nav class="tabs">
    <button data-tab="adv" class="on"><i>»</i>ผจญภัย</button>
    <button data-tab="team"><i>♟</i>ทีม</button>
    <button data-tab="gear"><i>⚔</i>อุปกรณ์</button>
    <button data-tab="gacha"><i>☕</i>ชงเรียก</button>
  </nav>
</div>

<div class="sheet hidden" id="sheet"></div>
<div class="gacha-fx hidden" id="gachaFx"></div>
<div id="toast" role="status"></div>

<script src="sprites.js"></script>
<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
